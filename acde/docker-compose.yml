services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - acde_mongo:/data/db

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/acde
      WORKSPACE_DIR: /workspace
      NGINX_CONF_DIR: /nginx-conf
      NGINX_RELOAD_CMD: ""
      FRONTEND_ORIGIN: http://localhost:5173
      DEPLOY_MODE: docker
      PROXY_UPSTREAM_HOST: host.docker.internal
    volumes:
      - ./workspace:/workspace
      - ./nginx/conf.d:/nginx-conf
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongo

volumes:
  acde_mongo:
