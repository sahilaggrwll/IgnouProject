apiVersion: v1
kind: Namespace
metadata:
  name: acde
---
# Template applied dynamically by the orchestrator for each project.
# Resource limits match synopsis: CPU 500m, Memory 512Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acde-sample
  namespace: acde
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acde-sample
  template:
    metadata:
      labels:
        app: acde-sample
    spec:
      containers:
        - name: app
          image: acde/sample:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: acde-sample
  namespace: acde
spec:
  type: NodePort
  selector:
    app: acde-sample
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31000
